<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>
  
  <!-- Infinity symbol (無限) -->
  <g transform="translate(128,120)" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-40,0 C-40,-24 -16,-24 0,0 C16,24 40,24 40,0 C40,-24 16,-24 0,0 C-16,24 -40,24 -40,0 Z" />
  </g>
  
  <!-- Small sparkle dots -->
  <circle cx="68" cy="68" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="188" cy="68" r="3" fill="#10b981" opacity="0.6"/>
  <circle cx="188" cy="172" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="68" cy="172" r="3" fill="#10b981" opacity="0.7"/>
  
  <!-- MUGEN text -->
  <text x="128" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="url(#accent)" letter-spacing="6">MUGEN</text>
</svg>
